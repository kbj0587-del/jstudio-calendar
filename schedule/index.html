<!-- Month navigator -->

<!-- 탭 + 저장/인쇄 -->
<div class="sch-tabbar" id="tabBar">

  <button class="sch-tab" id="btnSaveProgram" onclick="savePng('program')">🖼️ 프로그램 저장</button>
  <button class="sch-tab" onclick="window.print()">🖨️ 인쇄</button>

<!-- NAS 원본과 동일한 고정폭 캔버스 (좁은 화면에서는 JS가 통째로 축소) -->
<div class="canvas-viewport" id="canvasViewport">
  <div class="canvas-stage" id="canvasStage">
  <div class="sch-canvas" id="canvas">

    <div class="cv-banner">

        <div class="cv-pill-month" id="pillMonth">—</div>

    <div class="cv-table-shell">

          <tr>
            <th class="cv-th-time">TIME</th>

            <th class="cv-th-day">목</th>
            <th class="cv-th-day">금</th>
            <th class="cv-th-day">토</th>
          </tr>
        </thead>

    <!-- 프로그램 소개 (탭에 따라 표시) -->
    <div class="cv-programs" id="cvPrograms" style="display:none">

    <div class="cv-footer">
      <div class="cv-notice">
        <div class="cv-notice-accent"></div>

        <div class="cv-notice-sep"></div>
        <div class="cv-notice-text">플라잉요가와 번지피지오 전문센터 미사제이스튜디오에서, 건강하게 운동하세요.</div>
      </div>
      <div class="cv-brand">
        <h4 class="cv-brand-name">J.Studio</h4>
        <div class="cv-brand-contact">T. 010-9988-4417 ｜ Instagram @misaj_studio</div>
      </div>
    </div>

  </div>
  </div>
</div>

<!-- 관리자 진입 -->
<div class="sch-admin-entry">
  <a href="admin.html">🔒 관리자</a>
</div>

<!-- No data -->
<div id="noData" style="display:none;text-align:center;padding:60px 20px;color:var(--text-muted)">
  <div style="font-size:2rem;margin-bottom:12px">📋</div>
  <div style="font-weight:700;font-size:1.1rem">이번 달 시간표가 없어요</div>
  <div style="font-size:0.85rem;margin-top:6px">다른 달을 선택하거나 나중에 다시 확인해 주세요.</div>
</div>

<div id="toast"></div>

<script>
const DAYS = ['월','화','수','목','금','토'];
/* 원본 색상 체계: 번지피지오=하늘, 스텝박스=살구, 플라잉 계열=노랑 */
const PROGRAMS = ['번지피지오','스텝박스','플라잉요가','플라잉스트레칭','체어플라잉'];

let availableMonths = [];
let currentIdx = 0;
let timetable = null;
let programs = null;
let currentView = 'schedule';

async function init() {
  const urlM = new URLSearchParams(location.search).get('m');
  loadPrograms();
  await loadList();
  if (availableMonths.length === 0) { showNoData(); return; }

  if (urlM) {
    const [y, m] = urlM.split('-').map(Number);
    const idx = availableMonths.findIndex(a => a.year === y && a.month === m);
    currentIdx = idx >= 0 ? idx : 0;
  }
  await loadMonth();
}

async function loadList() {
  try {
    const r = await fetch('/api/schedule/list');
    const d = await r.json();
    availableMonths = d.months || [];
  } catch { availableMonths = []; }
}

async function loadPrograms() {
  try {
    const r = await fetch('/api/schedule/programs');
    const d = await r.json();
    programs = (d.programs && d.programs.items) || [];
  } catch { programs = []; }
  renderPrograms();
}

/* 프로그램 색 계열 — 시간표와 동일한 3색 체계 */
function programFamily(name) {
  if (name === '번지피지오') return '번지피지오';
  if (name === '스텝박스') return '스텝박스';
  if (['플라잉요가', '플라잉스트레칭', '체어플라잉'].includes(name)) return '플라잉';
  return '플라잉';
}

function renderPrograms() {
  const box = document.getElementById('cvProgramRows');
  if (!box) return;
  box.innerHTML = '';
  (programs || []).forEach(p => {
    const row = document.createElement('div');
    row.className = `cv-prow cv-p-${programFamily(p.name)}`;
    row.innerHTML = `
      <div class="cv-prow-label">
        <div class="cv-prow-name">${esc(p.name)}</div>
        ${p.level ? `<div class="cv-prow-level">${esc(p.level)}</div>` : ''}
      </div>
      <div class="cv-prow-gap"></div>
      <div class="cv-prow-desc">${esc(p.desc)}</div>`;
    box.appendChild(row);
  });
}

function setView(view) {
  currentView = view;
  document.getElementById('tabSchedule').classList.toggle('active', view === 'schedule');
  document.getElementById('tabProgram').classList.toggle('active', view === 'program');
  document.getElementById('cvPrograms').style.display = view === 'program' ? '' : 'none';
  fitCanvas();
}

/* SVG → PNG 굽기.
   html-to-image 의 toPng() 는 내부적으로 requestAnimationFrame 안에서 결과를
   내주는데, 탭이 백그라운드로 가면 rAF 가 아예 안 불려서 영원히 멈춘다.
   (실측 확인: document.hidden=true 이면 4초가 지나도 rAF 미발화)
   그래서 여기서는 toSvg() 까지만 라이브러리를 쓰고, 래스터화는 직접 한다. */
async function svgToPng(node, { width, height, pixelRatio, backgroundColor }) {
  const svgUrl = await htmlToImage.toSvg(node, { width, height, cacheBust: true });

  const img = new Image();
  img.decoding = 'async';
  await new Promise((resolve, reject) => {
    img.onload = resolve;
    img.onerror = () => reject(new Error('이미지 변환 실패'));
    img.src = svgUrl;
  });
  if (img.decode) { try { await img.decode(); } catch { /* 일부 브라우저에서만 실패 — 무시 */ } }

  const canvas = document.createElement('canvas');
  canvas.width = Math.round(width * pixelRatio);
  canvas.height = Math.round(height * pixelRatio);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = backgroundColor;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/png');
}

/* 캔버스 총 픽셀 수 상한 — 아이폰 사파리는 이 값을 넘으면 조용히 빈 이미지가 나온다 */
const MAX_EXPORT_PIXELS = 16000000;
function exportRatio(w, h) {
  const desired = window.innerWidth < 768 ? 2 : 3;
  const limit = Math.sqrt(MAX_EXPORT_PIXELS / (w * h));
  return Math.max(1, Math.min(desired, Math.floor(limit * 10) / 10));
}

/* 화면에 보이는 그대로 PNG 로 저장 (NAS 원본과 동일한 방식) */
async function savePng(kind) {
  const btn = document.getElementById(kind === 'program' ? 'btnSaveProgram' : 'btnSaveSchedule');
  if (!window.htmlToImage) { toast('저장 기능을 불러오지 못했어요.'); return; }
  const cv = document.getElementById('canvas');
  const stage = document.getElementById('canvasStage');
  const progBox = document.getElementById('cvPrograms');

  /* 저장 대상에 맞춰 프로그램 표를 잠깐 켜고/끄고, 축소는 풀어서 원본 해상도로 캡처 */
  const prevDisplay = progBox.style.display;
  const prevTransform = cv.style.transform;
  const prevStageW = stage.style.width;
  const prevStageH = stage.style.height;

  btn.disabled = true;
  const prevLabel = btn.textContent;
  btn.textContent = '저장 중…';

  try {
    progBox.style.display = kind === 'program' ? '' : 'none';
    cv.style.transform = 'none';
    stage.style.width = CANVAS_W + 'px';
    stage.style.height = cv.offsetHeight + 'px';
    /* 레이아웃·웹폰트가 확정될 시간을 준다 */
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    await new Promise(r => setTimeout(r, 250));

    const height = cv.offsetHeight;
    const dataUrl = await svgToPng(cv, {
      width: CANVAS_W,
      height,
      pixelRatio: exportRatio(CANVAS_W, height),
      backgroundColor: '#ffffff'
    });

    const month = timetable ? `${timetable.month}월` : '';
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = kind === 'program'
      ? `미사제이_스튜디오_프로그램_${month}.png`
      : `미사제이_스튜디오_시간표_${month}.png`;
    a.click();
    toast('이미지로 저장했어요!');
  } catch (e) {
    console.error('PNG 저장 실패:', e);
    toast('저장에 실패했어요. 다시 시도해 주세요.');
  } finally {
    progBox.style.display = prevDisplay;
    cv.style.transform = prevTransform;
    stage.style.width = prevStageW;
    stage.style.height = prevStageH;
    btn.disabled = false;
    btn.textContent = prevLabel;
    fitCanvas();
  }
}

async function loadMonth() {
  if (!availableMonths.length) return;
  const { year, month } = availableMonths[currentIdx];
  try {
    const r = await fetch(`/api/schedule/${year}/${month}`);
    if (!r.ok) { showNoData(); return; }
    const d = await r.json();
    timetable = d.timetable;
    render();
    updateUrl(year, month);
  } catch { showNoData(); }
}

/* ---------- 시간 표기 헬퍼 ---------- */

/* 'PM 7:30' -> '7:30' (원본 TIME 열 표기) */
function bareTime(label) {
  return String(label || '').replace(/^\s*(AM|PM)\s*/i, '').trim();
}
/* 'PM 7:30' -> '07:30' (원본 칸 좌상단 배지 표기: 시를 2자리로) */
function badgeTime(label) {
  const t = bareTime(label);
  const m = t.match(/^(\d{1,2}):(\d{2})$/);
  return m ? `${m[1].padStart(2,'0')}:${m[2]}` : t;
}
/* dayTimes {화:'PM 7:00', 목:'PM 7:00'} -> '화/목 7:00' (같은 시각은 묶음) */
function altTimeText(dayTimes) {
  const entries = DAYS.filter(d => (dayTimes || {})[d]).map(d => [d, bareTime(dayTimes[d])]);
  if (!entries.length) return '';
  const groups = [];
  entries.forEach(([d, t]) => {
    const g = groups.find(g => g.t === t);
    if (g) g.days.push(d); else groups.push({ t, days: [d] });
  });
  return groups.map(g => `${g.days.join('/')} ${g.t}`).join(' / ');
}

/* 표 안 안내문을 넣을 자리 찾기 —
   빈 칸이 3개 이상 연달아 있는 행 중 가장 긴 구간(원본의 12:30 행과 동일) */
function findNoteSpan(slots) {
  let best = null;
  slots.forEach((slot, si) => {
    let start = -1, len = 0;
    for (let i = 0; i <= DAYS.length; i++) {
      const filled = i < DAYS.length && (slot.days || {})[DAYS[i]]?.name;
      if (!filled && i < DAYS.length) {
        if (start < 0) { start = i; len = 1; } else len++;
      } else {
        if (len >= 3 && (!best || len > best.len)) best = { si, start, len };
        start = -1; len = 0;
      }
    }
  });
  return best;
}

function render() {
  if (!timetable) { showNoData(); return; }
  document.getElementById('noData').style.display = 'none';
  document.getElementById('canvasViewport').style.display = '';

  const { year, month, data, note } = timetable;
  document.getElementById('monthTitle').childNodes[0].nodeValue = `${year}년 ${month}월`;
  document.getElementById('monthSub').textContent = '';
  document.getElementById('pillMonth').textContent = `${month}월`;

  document.getElementById('btnPrev').disabled = currentIdx >= availableMonths.length - 1;
  document.getElementById('btnNext').disabled = currentIdx <= 0;

  renderCanvas(data.slots || [], note);
  fitCanvas();
}

function renderCanvas(slots, note) {
  const tbody = document.getElementById('cvBody');
  tbody.innerHTML = '';
  const noteSpan = note ? findNoteSpan(slots) : null;

  slots.forEach((slot, si) => {
    const tr = document.createElement('tr');
    const filledDays = DAYS.filter(d => (slot.days || {})[d]?.name);

    /* TIME 열: 윗줄 태그 / 시각 / 요일별 다른 시각 */
    const alt = altTimeText(slot.dayTimes);
    /* 원본은 수업이 한 요일뿐인 행에 'O요일'을 윗줄에 표기 */
    const tag = filledDays.length === 1 ? `${filledDays[0]}요일` : ' ';
    const timeTd = document.createElement('td');
    timeTd.className = 'cv-td-time';
    timeTd.innerHTML = `
      <div class="cv-time-inner">
        <div class="cv-time-tag">${esc(tag)}</div>
        <div class="cv-time-main">${esc(bareTime(slot.label))}</div>
        ${alt ? `<div class="cv-time-alt">${esc(alt)}</div>` : ''}
      </div>`;
    tr.appendChild(timeTd);

    for (let i = 0; i < DAYS.length; i++) {
      /* 안내문 병합 구간 */
      if (noteSpan && noteSpan.si === si && i === noteSpan.start) {
        const td = document.createElement('td');
        td.className = 'cv-td cv-td-note';
        td.colSpan = noteSpan.len;
        td.innerHTML = `
          <div class="cv-note">
            <span class="cv-note-bell">🔔</span>
            <span class="cv-note-text">${esc(note)}</span>
          </div>`;
        tr.appendChild(td);
        i += noteSpan.len - 1;
        continue;
      }

      const day = DAYS[i];
      const cls = (slot.days || {})[day];
      const td = document.createElement('td');
      td.className = 'cv-td';
      if (cls && cls.name) {
        const colorCls = PROGRAMS.includes(cls.name) ? `cv-c-${cls.name}` : 'cv-c-default';
        const badge = badgeTime((slot.dayTimes || {})[day] || slot.label);
        td.innerHTML = `
          <div class="cv-card ${colorCls}">
            <div class="cv-card-time">${esc(badge)}</div>
            <div class="cv-card-name">${esc(cls.name)}</div>
            ${cls.level ? `<div class="cv-card-level">${esc(cls.level)}</div>` : ''}
            <div class="cv-card-rule"></div>
            ${cls.instructor ? `<div class="cv-card-instructor">${esc(cls.instructor)}</div>` : ''}
          </div>`;
      }
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  });
}

/* 좁은 화면에서 캔버스를 통째로 축소 — 디자인 비율은 그대로 유지 */
const CANVAS_W = 1274;
function fitCanvas() {
  const vp = document.getElementById('canvasViewport');
  const stage = document.getElementById('canvasStage');
  const cv = document.getElementById('canvas');
  if (!vp || !stage || !cv) return;
  const style = getComputedStyle(vp);
  const avail = vp.clientWidth
    - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
  const scale = Math.min(1, avail / CANVAS_W);
  cv.style.transform = scale === 1 ? 'none' : `scale(${scale})`;
  /* 무대는 축소 후 실제 크기만큼만 자리를 차지한다 */
  stage.style.width = Math.floor(CANVAS_W * scale) + 'px';
  stage.style.height = Math.ceil(cv.offsetHeight * scale) + 'px';
}
addEventListener('resize', fitCanvas);
/* 캔버스 자체 높이가 바뀔 때(달 전환 등)만 다시 계산 — body 관찰은 무한루프 위험 */
if (window.ResizeObserver)
  new ResizeObserver(fitCanvas).observe(document.getElementById('canvas'));

function changeMonth(dir) {
  currentIdx += dir * -1; // list is newest-first, so +1 dir = decrease idx
  if (currentIdx < 0) currentIdx = 0;
  if (currentIdx >= availableMonths.length) currentIdx = availableMonths.length - 1;
  loadMonth();
}

function showNoData() {
  document.getElementById('noData').style.display = '';
  document.getElementById('canvasViewport').style.display = 'none';
  document.getElementById('tabBar').style.display = 'none';
  document.getElementById('monthTitle').childNodes[0].nodeValue = '시간표 없음';
}

function updateUrl(y, m) {
  const url = `${location.pathname}?m=${y}-${String(m).padStart(2,'0')}`;
  history.replaceState(null, '', url);
}

function shareUrl() {
  if (navigator.share) {
    navigator.share({ title: '수업 시간표 · 미사 제이스튜디오', url: location.href });
  } else {
    navigator.clipboard.writeText(location.href).then(() => toast('링크를 복사했어요!'));
  }
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

init();
</script>
