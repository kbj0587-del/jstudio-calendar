<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시간표 관리 · 미사 제이스튜디오</title>
<link rel="stylesheet" href="schedule.css">
<style>
.day-time-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.day-time-row select { width:50px; padding:6px 4px; font-size:0.82rem; border-radius:6px; border:1.5px solid var(--border); background:var(--surface); color:var(--text); }
.day-time-row input { flex:1; }
.day-time-row .btn-remove-dt { color:#dc2626; font-size:1rem; padding:0 4px; }
.slot-drag-handle { cursor:grab; color:var(--text-muted); padding:0 6px; font-size:1rem; }
.slot-drag-handle:active { cursor:grabbing; }
.btn-add-slot {
  display:flex; align-items:center; gap:6px;
  padding:10px 18px; border-radius:var(--radius-sm);
  background:var(--surface2); border:1.5px dashed var(--border);
  color:var(--text-muted); font-size:0.85rem; font-weight:600;
  width:100%; justify-content:center; margin-top:10px;
  transition:all var(--tr);
}
.btn-add-slot:hover { background:var(--surface); border-color:var(--accent); color:var(--accent); }
.saving-dot {
  width:8px; height:8px; border-radius:50%;
  background:#16a34a; display:inline-block; margin-right:4px;
  animation:pulse 1.2s ease infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
</style>
</head>
<body>

<!-- Auth gate -->
<div class="auth-gate" id="authGate">
  <div class="auth-card">
    <div style="font-size:2rem;margin-bottom:12px">📅</div>
    <h2>시간표 관리</h2>
    <p>관리자 비밀번호를 입력하세요</p>
    <div class="form-group">
      <input type="password" class="form-input" id="authPw" placeholder="비밀번호"
        onkeydown="if(event.key==='Enter') doAuth()">
    </div>
    <button class="btn-save" style="width:100%" onclick="doAuth()">로그인</button>
    <div class="auth-error" id="authError"></div>
  </div>
</div>

<!-- Header -->
<header class="sch-header" id="appHeader" style="display:none">
  <div class="sch-header-inner">
    <div class="sch-logo">
      <span>⭐</span>
      <span>시간표 관리<span class="dot">.</span></span>
    </div>
    <nav class="sch-nav">
      <a href="index.html" class="sch-btn ghost" target="_blank">👁 공개 보기</a>
      <span id="savingIndicator" style="font-size:0.78rem;color:var(--text-muted);display:none">
        <span class="saving-dot"></span>저장 중…
      </span>
    </nav>
  </div>
</header>

<!-- Month manager -->
<div class="month-manager" id="monthManager" style="display:none">
  <div class="month-manager-inner">
    <label>월 선택</label>
    <select class="form-select" id="monthSelect" style="width:auto;padding:6px 10px" onchange="onMonthSelect()"></select>
    <button class="sch-btn ghost" onclick="showNewMonthModal()">+ 새 달</button>
    <button class="sch-btn ghost" onclick="showCopyModal()">📋 복사</button>
    <div class="spacer"></div>
    <span id="publishBadge" class="publish-badge off">● 비공개</span>
    <button class="sch-btn" id="btnTogglePublish" onclick="togglePublish()">공개하기</button>
    <button class="sch-btn ghost" onclick="confirmDelete()" title="이 달 시간표 삭제" style="color:#dc2626">🗑</button>
  </div>
</div>

<!-- Admin bar -->
<div class="admin-bar" id="adminBar" style="display:none">
  <div class="month-nav" style="max-width:none;margin:0;padding:0;flex:1">
    <button class="btn-month-arrow" id="btnPrev" onclick="changeMonth(-1)">‹</button>
    <h1 id="monthTitle">—</h1>
    <button class="btn-month-arrow" id="btnNext" onclick="changeMonth(1)">›</button>
  </div>
</div>

<!-- Note bar (editable) -->
<div class="sch-note" id="noteArea" style="display:none">
  <div style="display:flex;align-items:center;gap:8px">
    <span>💬</span>
    <input class="form-input" id="noteInput" placeholder="안내 메모 (예: 수업 시작 전 10분...)"
      style="flex:1;font-size:0.83rem;padding:7px 10px"
      onchange="saveNote()">
  </div>
</div>

<!-- Desktop table -->
<div class="sch-table-wrap" id="tableWrap" style="display:none">
  <table class="sch-table" id="schTable">
    <thead>
      <tr>
        <th>시간 <small style="font-weight:400;color:var(--text-muted)">(클릭 편집)</small></th>
        <th>월</th><th>화</th><th>수</th><th>목</th><th>금</th>
        <th class="col-sat">토</th>
      </tr>
    </thead>
    <tbody id="schBody"></tbody>
  </table>
  <button class="btn-add-slot" onclick="addSlot()">+ 시간대 추가</button>
</div>

<!-- 프로그램 소개 편집 (모든 달 공통) -->
<div class="sch-table-wrap" id="programWrap" style="display:none">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;
              padding:10px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap">
    <strong style="font-size:0.95rem">📋 프로그램 소개 <small style="font-weight:400;color:var(--text-muted)">— 모든 달에 공통 적용</small></strong>
    <div style="display:flex;gap:6px">
      <button class="btn-add-slot" style="margin:0;padding:6px 12px" onclick="addProgram()">+ 항목 추가</button>
      <button class="btn-save" onclick="savePrograms()">저장</button>
    </div>
  </div>
  <table class="sch-table">
    <thead>
      <tr>
        <th style="width:150px">프로그램</th>
        <th style="width:130px">레벨</th>
        <th>설명</th>
        <th style="width:60px">삭제</th>
      </tr>
    </thead>
    <tbody id="programBody"></tbody>
  </table>
</div>

<!-- No data -->
<div id="noData" style="display:none;text-align:center;padding:60px 20px;color:var(--text-muted)">
  <div style="font-size:2rem;margin-bottom:12px">📋</div>
  <div style="font-weight:700;font-size:1.1rem">시간표가 없어요</div>
  <div style="font-size:0.85rem;margin-top:8px">새 달을 만들거나 다른 달을 복사해서 시작하세요.</div>
  <button class="sch-btn primary" style="margin-top:16px" onclick="showNewMonthModal()">+ 새 달 만들기</button>
</div>

<!-- ══ Cell Edit Modal ══ -->
<div class="modal-overlay" id="cellModal">
  <div class="modal">
    <div class="modal-title">
      <span id="cellModalTitle">수업 편집</span>
      <button class="modal-close" onclick="closeCellModal()">✕</button>
    </div>
    <div class="form-group">
      <label>수업 이름</label>
      <input class="form-input" id="fName" placeholder="예: 번지피지오">
      <div class="form-hint">
        <button onclick="setName('번지피지오')">번지피지오</button>
        <button onclick="setName('플라잉요가')">플라잉요가</button>
        <button onclick="setName('스텝박스')">스텝박스</button>
        <button onclick="setName('체어플라잉')">체어플라잉</button>
        <button onclick="setName('플라잉스트레칭')">플라잉스트레칭</button>
      </div>
    </div>
    <div class="form-group">
      <label>레벨 / 스타일</label>
      <input class="form-input" id="fLevel" placeholder="예: Lv.0, 베이직, 유산소/근력">
      <div class="form-hint">
        <button onclick="setLevel('Lv.0')">Lv.0</button>
        <button onclick="setLevel('Lv.1')">Lv.1</button>
        <button onclick="setLevel('베이직')">베이직</button>
        <button onclick="setLevel('안무베이직')">안무베이직</button>
        <button onclick="setLevel('워크아웃')">워크아웃</button>
        <button onclick="setLevel('콤비네이션')">콤비네이션</button>
        <button onclick="setLevel('유산소/근력')">유산소/근력</button>
        <button onclick="setLevel('스트레칭/근력')">스트레칭/근력</button>
        <button onclick="setLevel('아로마/로우')">아로마/로우</button>
      </div>
    </div>
    <div class="form-group">
      <label>강사</label>
      <input class="form-input" id="fInstructor" placeholder="예: 연재, 민정, 현정">
      <div class="form-hint">
        <button onclick="setInstructor('연재')">연재</button>
        <button onclick="setInstructor('민정')">민정</button>
        <button onclick="setInstructor('현정')">현정</button>
        <button onclick="setInstructor('1,3주 연재 / 2,4주 민정')">1,3주 연재 / 2,4주 민정</button>
      </div>
    </div>
    <div class="form-group">
      <label>비고</label>
      <input class="form-input" id="fNote" placeholder="예: ※ AM 11:30">
    </div>
    <div class="modal-actions">
      <button class="btn-clear" onclick="clearCell()">수업 지우기</button>
      <button class="btn-cancel-sm" onclick="closeCellModal()">취소</button>
      <button class="btn-save" onclick="saveCellEdit()">저장</button>
    </div>
  </div>
</div>

<!-- ══ Slot Edit Modal ══ -->
<div class="modal-overlay" id="slotModal">
  <div class="modal">
    <div class="modal-title">
      <span>시간대 편집</span>
      <button class="modal-close" onclick="closeSlotModal()">✕</button>
    </div>
    <div class="form-group">
      <label>기본 시간</label>
      <input class="form-input" id="sLabel" placeholder="예: AM 11:10, PM 7:30">
      <div class="form-hint">
        <button onclick="document.getElementById('sLabel').value='AM 10:10'">AM 10:10</button>
        <button onclick="document.getElementById('sLabel').value='AM 11:10'">AM 11:10</button>
        <button onclick="document.getElementById('sLabel').value='AM 12:30'">AM 12:30</button>
        <button onclick="document.getElementById('sLabel').value='PM 7:30'">PM 7:30</button>
        <button onclick="document.getElementById('sLabel').value='PM 8:30'">PM 8:30</button>
        <button onclick="document.getElementById('sLabel').value='PM 9:30'">PM 9:30</button>
      </div>
    </div>
    <div class="form-group">
      <label>요일별 다른 시간 <small style="text-transform:none;letter-spacing:0;font-weight:400">(선택)</small></label>
      <div id="dayTimeRows"></div>
      <button class="sch-btn ghost" style="margin-top:6px;font-size:0.8rem;padding:5px 10px" onclick="addDayTimeRow()">+ 요일 추가</button>
    </div>
    <div class="modal-actions">
      <button class="btn-clear" onclick="deleteSlot()">시간대 삭제</button>
      <button class="btn-cancel-sm" onclick="closeSlotModal()">취소</button>
      <button class="btn-save" onclick="saveSlotEdit()">저장</button>
    </div>
  </div>
</div>

<!-- ══ New Month Modal ══ -->
<div class="modal-overlay" id="newMonthModal">
  <div class="modal">
    <div class="modal-title">
      새 달 만들기
      <button class="modal-close" onclick="document.getElementById('newMonthModal').classList.remove('open')">✕</button>
    </div>
    <div class="form-group">
      <label>연도</label>
      <input class="form-input" id="nmYear" type="number" min="2020" max="2030">
    </div>
    <div class="form-group">
      <label>월</label>
      <select class="form-select" id="nmMonth">
        <option value="1">1월</option><option value="2">2월</option>
        <option value="3">3월</option><option value="4">4월</option>
        <option value="5">5월</option><option value="6">6월</option>
        <option value="7">7월</option><option value="8">8월</option>
        <option value="9">9월</option><option value="10">10월</option>
        <option value="11">11월</option><option value="12">12월</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel-sm" onclick="document.getElementById('newMonthModal').classList.remove('open')">취소</button>
      <button class="btn-save" onclick="createNewMonth()">만들기</button>
    </div>
  </div>
</div>

<!-- ══ Copy Modal ══ -->
<div class="modal-overlay" id="copyModal">
  <div class="modal">
    <div class="modal-title">
      다른 달에서 복사
      <button class="modal-close" onclick="document.getElementById('copyModal').classList.remove('open')">✕</button>
    </div>
    <div class="form-group">
      <label>복사할 원본 달</label>
      <select class="form-select" id="copyFromSelect" style="width:100%"></select>
    </div>
    <div class="form-group">
      <label>붙여넣을 달 (현재 선택된 달)</label>
      <input class="form-input" id="copyToLabel" readonly>
    </div>
    <p style="font-size:0.8rem;color:#dc2626;margin-top:4px">⚠️ 현재 시간표를 덮어씁니다.</p>
    <div class="modal-actions">
      <button class="btn-cancel-sm" onclick="document.getElementById('copyModal').classList.remove('open')">취소</button>
      <button class="btn-save" onclick="doCopy()">복사하기</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const DAYS = ['월','화','수','목','금','토'];
const CLASS_COLORS = {
  '번지피지오': 'cls-번지피지오', '플라잉요가': 'cls-플라잉요가',
  '스텝박스': 'cls-스텝박스', '체어플라잉': 'cls-체어플라잉',
  '플라잉스트레칭': 'cls-플라잉스트레칭'
};

let adminPw = '';
let availableMonths = [];
let currentIdx = 0;
let timetable = null;
let editSlotId = null, editDay = null;
let editingSlotId = null;

if (matchMedia('(prefers-color-scheme: dark)').matches)
  document.documentElement.setAttribute('data-theme', 'dark');

// ── Auth ────────────────────────────────────
async function doAuth() {
  const pw = document.getElementById('authPw').value.trim();
  if (!pw) return;
  try {
    const r = await fetch('/api/admin/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-password': pw },
      body: JSON.stringify({ password: pw })
    });
    if (!r.ok) { document.getElementById('authError').textContent = '비밀번호가 틀렸어요.'; return; }
    adminPw = pw;
    document.getElementById('authGate').style.display = 'none';
    document.getElementById('appHeader').style.display = '';
    document.getElementById('monthManager').style.display = '';
    document.getElementById('adminBar').style.display = '';
    document.getElementById('noteArea').style.display = '';
    document.getElementById('tableWrap').style.display = '';
    document.getElementById('programWrap').style.display = '';
    await loadAll();
    await loadPrograms();
  } catch {
    document.getElementById('authError').textContent = '서버 연결 오류.';
  }
}

function apiHeaders() {
  return { 'Content-Type': 'application/json', 'x-admin-password': adminPw };
}

// ── 프로그램 소개 ──────────────────────────────
let programs = [];

async function loadPrograms() {
  try {
    const r = await fetch('/api/schedule/programs', { headers: apiHeaders() });
    const d = await r.json();
    programs = (d.programs && d.programs.items) || [];
  } catch { programs = []; }
  renderProgramRows();
}

function renderProgramRows() {
  const tb = document.getElementById('programBody');
  tb.innerHTML = '';
  programs.forEach((p, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input class="form-input" style="width:100%;font-size:0.83rem;padding:6px 8px"
            value="${escAttr(p.name)}" oninput="programs[${i}].name=this.value"></td>
      <td><input class="form-input" style="width:100%;font-size:0.83rem;padding:6px 8px"
            value="${escAttr(p.level)}" oninput="programs[${i}].level=this.value"></td>
      <td><input class="form-input" style="width:100%;font-size:0.83rem;padding:6px 8px"
            value="${escAttr(p.desc)}" oninput="programs[${i}].desc=this.value"></td>
      <td style="text-align:center">
        <button class="btn-cancel-sm" style="padding:4px 9px" onclick="removeProgram(${i})">✕</button>
      </td>`;
    tb.appendChild(tr);
  });
  if (!programs.length) {
    tb.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:20px;color:var(--text-muted)">항목이 없어요. “+ 항목 추가”를 눌러 주세요.</td></tr>';
  }
}

function addProgram() {
  programs.push({ name: '', level: '', desc: '' });
  renderProgramRows();
}

function removeProgram(i) {
  programs.splice(i, 1);
  renderProgramRows();
}

async function savePrograms() {
  const items = programs.filter(p => (p.name || '').trim());
  try {
    const r = await fetch('/api/schedule/programs', {
      method: 'PUT', headers: apiHeaders(), body: JSON.stringify({ items })
    });
    if (!r.ok) { toast('저장 실패 (권한 또는 서버 오류)'); return; }
    const d = await r.json();
    programs = (d.programs && d.programs.items) || items;
    renderProgramRows();
    toast('프로그램 소개를 저장했어요!');
  } catch {
    toast('서버 연결 오류');
  }
}

function escAttr(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

// ── Load ─────────────────────────────────────
async function loadAll() {
  await loadList();
  if (!availableMonths.length) { showNoData(); return; }
  await loadMonth();
}

async function loadList() {
  const r = await fetch('/api/schedule/list', { headers: apiHeaders() });
  const d = await r.json();
  availableMonths = d.months || [];
  rebuildMonthSelect();
}

function rebuildMonthSelect() {
  const sel = document.getElementById('monthSelect');
  sel.innerHTML = '';
  availableMonths.forEach((m, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `${m.year}년 ${m.month}월`;
    sel.appendChild(opt);
  });
  sel.value = currentIdx;
}

async function loadMonth() {
  if (!availableMonths.length) { showNoData(); return; }
  const { year, month } = availableMonths[currentIdx];
  const r = await fetch(`/api/schedule/${year}/${month}`, { headers: apiHeaders() });
  if (!r.ok) { showNoData(); return; }
  const d = await r.json();
  timetable = d.timetable;
  render();
}

// ── Render ───────────────────────────────────
function render() {
  if (!timetable) { showNoData(); return; }
  document.getElementById('noData').style.display = 'none';
  document.getElementById('schTable').closest('.sch-table-wrap').style.display = '';

  const { year, month, data, note, published } = timetable;
  document.getElementById('monthTitle').textContent = `${year}년 ${month}월`;
  document.getElementById('noteInput').value = note || '';

  // Publish badge
  const badge = document.getElementById('publishBadge');
  const btn = document.getElementById('btnTogglePublish');
  if (published) {
    badge.textContent = '● 공개 중'; badge.className = 'publish-badge on';
    btn.textContent = '비공개로';
  } else {
    badge.textContent = '● 비공개'; badge.className = 'publish-badge off';
    btn.textContent = '공개하기';
  }

  // Nav
  document.getElementById('btnPrev').disabled = currentIdx <= 0;
  document.getElementById('btnNext').disabled = currentIdx >= availableMonths.length - 1;
  document.getElementById('monthSelect').value = currentIdx;

  renderTable(data.slots || []);
}

function renderTable(slots) {
  const tbody = document.getElementById('schBody');
  tbody.innerHTML = '';
  slots.forEach(slot => {
    const altParts = Object.entries(slot.dayTimes || {}).map(([d, t]) => `${d} ${t}`).join(' / ');
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="sch-time" style="cursor:pointer" onclick="openSlotModal('${slot.id}')" title="시간대 편집">
        <div class="slot-row-ctrl">
          <div>
            <div class="sch-time-main">${esc(slot.label)}</div>
            ${altParts ? `<div class="sch-time-alt">${esc(altParts)}</div>` : ''}
          </div>
          <span style="margin-left:4px;font-size:0.7rem;color:var(--accent);opacity:0" class="btn-slot-edit">✏️</span>
        </div>
      </td>`;
    DAYS.forEach(day => {
      const cls = (slot.days || {})[day];
      const td = document.createElement('td');
      td.className = 'sch-cell editable';
      td.onclick = () => openCellModal(slot.id, day, cls);
      if (cls && cls.name) {
        const colorCls = CLASS_COLORS[cls.name] || 'cls-default';
        td.innerHTML = `
          <div class="sch-class ${colorCls}">
            <div class="sch-class-name">${esc(cls.name)}</div>
            ${cls.level ? `<div class="sch-class-level">${esc(cls.level)}</div>` : ''}
            ${cls.instructor ? `<div class="sch-class-instructor">👤 ${esc(cls.instructor)}</div>` : ''}
            ${cls.note ? `<div class="sch-class-note">${esc(cls.note)}</div>` : ''}
          </div>`;
      } else {
        td.innerHTML = '<div class="sch-empty"><div class="edit-add-hint">+ 추가</div></div>';
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

// ── Cell Modal ───────────────────────────────
function openCellModal(slotId, day, existing) {
  editSlotId = slotId; editDay = day;
  document.getElementById('cellModalTitle').textContent = `${day}요일 수업 편집`;
  document.getElementById('fName').value = existing?.name || '';
  document.getElementById('fLevel').value = existing?.level || '';
  document.getElementById('fInstructor').value = existing?.instructor || '';
  document.getElementById('fNote').value = existing?.note || '';
  document.getElementById('cellModal').classList.add('open');
  setTimeout(() => document.getElementById('fName').focus(), 100);
}
function closeCellModal() { document.getElementById('cellModal').classList.remove('open'); }
function setName(v) { document.getElementById('fName').value = v; }
function setLevel(v) { document.getElementById('fLevel').value = v; }
function setInstructor(v) { document.getElementById('fInstructor').value = v; }

async function saveCellEdit() {
  const cell = {
    name: document.getElementById('fName').value.trim(),
    level: document.getElementById('fLevel').value.trim(),
    instructor: document.getElementById('fInstructor').value.trim(),
    note: document.getElementById('fNote').value.trim()
  };
  if (!cell.name) { await clearCell(); return; }
  await apiPut(`cell`, { slotId: editSlotId, day: editDay, cell });
  closeCellModal();
}
async function clearCell() {
  await apiPut(`cell`, { slotId: editSlotId, day: editDay, cell: null });
  closeCellModal();
}

// ── Slot Modal ───────────────────────────────
function openSlotModal(slotId) {
  editingSlotId = slotId;
  const slot = (timetable.data.slots || []).find(s => s.id === slotId);
  if (!slot) return;
  document.getElementById('sLabel').value = slot.label || '';
  buildDayTimeRows(slot.dayTimes || {});
  document.getElementById('slotModal').classList.add('open');
}
function closeSlotModal() { document.getElementById('slotModal').classList.remove('open'); }

function buildDayTimeRows(dayTimes) {
  const cont = document.getElementById('dayTimeRows');
  cont.innerHTML = '';
  Object.entries(dayTimes).forEach(([day, time]) => addDayTimeRow(day, time));
}
function addDayTimeRow(day, time) {
  const cont = document.getElementById('dayTimeRows');
  const row = document.createElement('div');
  row.className = 'day-time-row';
  const dayOpts = DAYS.map(d => `<option value="${d}" ${d===day?'selected':''}>${d}</option>`).join('');
  row.innerHTML = `
    <select>${dayOpts}</select>
    <input class="form-input" value="${esc(time||'')}" placeholder="예: AM 11:30">
    <button class="btn-remove-dt" onclick="this.parentElement.remove()">✕</button>`;
  cont.appendChild(row);
}
function getDayTimes() {
  const result = {};
  document.querySelectorAll('.day-time-row').forEach(row => {
    const sel = row.querySelector('select');
    const inp = row.querySelector('input');
    if (sel && inp && inp.value.trim()) result[sel.value] = inp.value.trim();
  });
  return result;
}

async function saveSlotEdit() {
  const label = document.getElementById('sLabel').value.trim();
  if (!label) return toast('시간을 입력하세요');
  await apiPut(`slot`, {
    action: 'update',
    slot: { id: editingSlotId, label, dayTimes: getDayTimes() }
  });
  closeSlotModal();
}
async function deleteSlot() {
  if (!confirm('이 시간대와 모든 수업을 삭제할까요?')) return;
  await apiPut(`slot`, { action: 'delete', slot: { id: editingSlotId } });
  closeSlotModal();
}
async function addSlot() {
  await apiPut(`slot`, { action: 'add', slot: { label: '새 시간' } });
}

// ── Month management ─────────────────────────
function onMonthSelect() {
  currentIdx = parseInt(document.getElementById('monthSelect').value);
  loadMonth();
}
function changeMonth(dir) {
  // list newest-first: prev = increase idx, next = decrease idx
  const newIdx = currentIdx + dir;
  if (newIdx < 0 || newIdx >= availableMonths.length) return;
  currentIdx = newIdx;
  document.getElementById('monthSelect').value = currentIdx;
  loadMonth();
}

function showNewMonthModal() {
  const now = new Date();
  document.getElementById('nmYear').value = now.getFullYear();
  document.getElementById('nmMonth').value = now.getMonth() + 1;
  document.getElementById('newMonthModal').classList.add('open');
}
async function createNewMonth() {
  const year = parseInt(document.getElementById('nmYear').value);
  const month = parseInt(document.getElementById('nmMonth').value);
  const r = await fetch('/api/schedule', {
    method: 'POST',
    headers: apiHeaders(),
    body: JSON.stringify({ year, month, data: { slots: [] }, published: false })
  });
  if (!r.ok) { toast('생성 실패'); return; }
  document.getElementById('newMonthModal').classList.remove('open');
  await loadAll();
  currentIdx = availableMonths.findIndex(m => m.year === year && m.month === month);
  if (currentIdx < 0) currentIdx = 0;
  rebuildMonthSelect();
  await loadMonth();
  toast(`${year}년 ${month}월 시간표가 만들어졌어요!`);
}

function showCopyModal() {
  const { year, month } = availableMonths[currentIdx] || {};
  document.getElementById('copyToLabel').value = `${year}년 ${month}월`;
  const sel = document.getElementById('copyFromSelect');
  sel.innerHTML = availableMonths
    .filter((m, i) => i !== currentIdx)
    .map(m => `<option value="${m.year}/${m.month}">${m.year}년 ${m.month}월</option>`)
    .join('');
  document.getElementById('copyModal').classList.add('open');
}
async function doCopy() {
  const [fromYear, fromMonth] = document.getElementById('copyFromSelect').value.split('/').map(Number);
  const { year, month } = availableMonths[currentIdx];
  const r = await fetch(`/api/schedule/${year}/${month}/copy-from`, {
    method: 'POST', headers: apiHeaders(),
    body: JSON.stringify({ fromYear, fromMonth })
  });
  if (!r.ok) { toast('복사 실패'); return; }
  document.getElementById('copyModal').classList.remove('open');
  await loadMonth();
  toast('복사 완료!');
}

async function togglePublish() {
  const { year, month, published } = timetable;
  const r = await fetch(`/api/schedule/${year}/${month}/publish`, {
    method: 'POST', headers: apiHeaders(),
    body: JSON.stringify({ published: !published })
  });
  if (!r.ok) { toast('변경 실패'); return; }
  const d = await r.json();
  timetable = d.timetable;
  render();
  toast(timetable.published ? '공개되었습니다' : '비공개로 변경됐어요');
}

async function confirmDelete() {
  const { year, month } = availableMonths[currentIdx];
  if (!confirm(`${year}년 ${month}월 시간표를 삭제할까요?`)) return;
  await fetch(`/api/schedule/${year}/${month}`, { method: 'DELETE', headers: apiHeaders() });
  await loadAll();
  if (!availableMonths.length) showNoData();
  toast('삭제됐어요');
}

async function saveNote() {
  const { year, month } = timetable;
  const note = document.getElementById('noteInput').value.trim();
  await fetch(`/api/schedule/${year}/${month}/note`, {
    method: 'PUT', headers: apiHeaders(), body: JSON.stringify({ note })
  });
}

// ── API helpers ──────────────────────────────
async function apiPut(endpoint, body) {
  if (!timetable) return;
  const { year, month } = timetable;
  showSaving(true);
  try {
    const r = await fetch(`/api/schedule/${year}/${month}/${endpoint}`, {
      method: 'PUT', headers: apiHeaders(), body: JSON.stringify(body)
    });
    if (!r.ok) { toast('저장 실패 😢'); return; }
    const d = await r.json();
    timetable = d.timetable;
    render();
    toast('저장됐어요 ✓');
  } catch { toast('서버 오류'); }
  finally { showSaving(false); }
}

function showSaving(on) {
  document.getElementById('savingIndicator').style.display = on ? '' : 'none';
}

function showNoData() {
  document.getElementById('noData').style.display = '';
  document.querySelector('.sch-table-wrap')?.style && (document.querySelector('.sch-table-wrap').style.display = 'none');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// slot edit button hover visibility fix
document.addEventListener('mouseover', e => {
  const btn = e.target.closest('td.sch-time')?.querySelector('.btn-slot-edit');
  if (btn) btn.style.opacity = '1';
});
document.addEventListener('mouseout', e => {
  const btn = e.target.closest('td.sch-time')?.querySelector('.btn-slot-edit');
  if (btn) btn.style.opacity = '0';
});
</script>
